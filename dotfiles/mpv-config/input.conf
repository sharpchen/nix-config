alt+. playlist-next
alt+, playlist-prev
alt+RIGHT playlist-next
alt+LEFT playlist-prev

l frame-step # advance one frame and pause
h frame-back-step

alt+enter cycle fullscreen

g-g playlist-play-index 0
G set playlist-pos-1 ${playlist-count}

r cycle_values video-rotate "90" "180" "270" "0"
alt+v vf toggle flip # vertical mirror
alt+h vf toggle hflip # horizontal mirror

m ab-loop
s cycle mute

w screenshot
W screenshot video # ss without subtitle

ctrl+l cycle-values loop-file "inf" "no"
ctrl+shift+l cycle-values loop-playlist yes no

ctrl+= add volume 2
ctrl+- add volume -2

alt+= add video-zoom 0.1
alt+- add video-zoom -0.1

# see: https://github.com/mpv-player/mpv/blob/8c67647b50059406c5c0444903597281b81516cf/player/lua/osc.lua#L3410
o script-binding osc/visibility # cycle osc visibility mode

t ignore # preserved prefix t for toggle/cycle operation
d ignore # preserved prefix d for clear operation
